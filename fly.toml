# fly.toml app configuration file generated for rag-arena on 2026-08-18T19:19:39Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rag-arena'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    LEAN = '1'
    PREFETCH_MODEL = '1'

# Served directly by Fly's edge, bypassing the app entirely. If a file here doesn't
# match the requested path, Fly forwards the request to the app as normal - this is
# what lets robots.txt/sitemap.xml/about.html work even if Streamlit is slow or busy,
# and is why "/" itself must never collide with a filename in public/ (no index.html).
[[statics]]
  guest_path = '/app/public'
  url_prefix = '/'

[env]
  API_PORT = '8000'
  EMBED_BATCH_SIZE = '8'
  EMBED_THREADS = '1'
  GRAPH_BACKEND = 'networkx'
  PORT = '8501'
  TOP_K = '3'
  VECTOR_BACKEND = 'numpy'

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 30
    soft_limit = 15

[checks]
  [checks.health]
    port = 8501
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/_stcore/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
